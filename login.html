<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | CampusCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container"><a class="navbar-brand brand-mark" href="index.html"><img
                    src="images/campuscare-logo.png" alt="CampusCare logo" class="brand-logo"> CampusCare</a><button
                class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="appointment.html">Appointment</a></li>
                    <li class="nav-item"><a class="nav-link" href="status.html">Status</a></li>
                    <li class="nav-item auth-nav" id="authNav"></li>
                    <li class="nav-item ms-lg-3"><button class="theme-toggle" type="button" id="themeToggle"
                            aria-label="Switch to dark mode" title="Switch theme"><span
                                class="theme-icon">&#127769;</span></button></li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <section class="page-hero">
            <div class="container"><span class="section-kicker">Welcome back</span>
                <h1>Login</h1>
                <p>Access CampusCare with the account saved on this browser.</p>
            </div>
        </section>
        <section class="section-padding">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-6">
                        <div class="form-shell auth-shell">
                            <div id="authAlert" class="mb-4" aria-live="polite"></div>
                            <form id="loginForm" novalidate>
                                <div class="mb-3"><label for="loginEmail" class="form-label">Email</label><input
                                        type="email" class="form-control" id="loginEmail" autocomplete="email" required>
                                    <div class="invalid-feedback">Please enter your email.</div>
                                </div>
                                <div class="mb-4"><label for="loginPassword" class="form-label">Password</label>
                                    <div class="password-field"><input type="password" class="form-control"
                                            id="loginPassword" autocomplete="current-password" required><button
                                            class="password-toggle" type="button" data-password-toggle
                                            data-password-target="loginPassword" aria-label="Show password"><span
                                                aria-hidden="true">&#128065;</span></button></div>
                                    <div class="invalid-feedback">Please enter your password.</div>
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
                            </form>
                            <p class="auth-switch mb-0">New to CampusCare? <a href="register.html">Create an account</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
